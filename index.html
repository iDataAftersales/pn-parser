<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.container{max-width:1000px;margin:0 auto;background:white;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px;text-align:center}
.header h1{font-size:28px;margin-bottom:10px}
.header p{opacity:0.9;font-size:14px}
.content{padding:40px}
.input-section{margin-bottom:30px}
.input-group{display:flex;gap:10px;margin-bottom:15px}
.input-group input{flex:1;padding:14px 18px;border:2px solid #e0e0e0;border-radius:10px;font-size:18px;font-family:'Courier New',monospace;transition:all 0.3s}
.input-group input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 4px rgba(102,126,234,0.1)}
.input-group button{padding:14px 36px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s}
.input-group button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,0.4)}
.input-group button:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.examples{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.examples label{font-size:14px;color:#666;margin-right:10px}
.example-btn{padding:6px 14px;background:#f0f0f0;border:1px solid #ddd;border-radius:6px;font-size:13px;cursor:pointer;transition:all 0.2s;font-family:'Courier New',monospace}
.example-btn:hover{background:#667eea;color:white;border-color:#667eea}
.status-bar{background:#e8f5e9;border:1px solid #4caf50;border-radius:8px;padding:12px 18px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:14px}
.status-bar.loading{background:#fff3cd;border-color:#ffc107}
.status-bar.error{background:#ffebee;border-color:#f44336}
.result-section{display:none}
.result-section.active{display:block;animation:slideIn 0.3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result-header{background:#f8f9fa;padding:20px;border-radius:10px;margin-bottom:20px}
.result-header h2{font-size:22px;color:#333;margin-bottom:10px;font-family:'Courier New',monospace;word-break:break-all}
.result-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font-size:14px;color:#666}
.stats{background:#e3f2fd;border:1px solid #2196f3;border-radius:10px;padding:15px;margin-bottom:20px;display:flex;justify-content:space-around;text-align:center}
.stat-item{flex:1}
.stat-value{font-size:26px;font-weight:bold;color:#2196f3}
.stat-label{font-size:12px;color:#666;margin-top:5px}
.fields-section{margin-top:20px}
.fields-section h3{font-size:18px;color:#333;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #e0e0e0}
.field-item{background:#f8f9fa;padding:15px;border-radius:10px;margin-bottom:10px;border-left:4px solid #667eea;transition:all 0.2s}
.field-item:hover{background:#f0f0f0}
.field-item.error{border-left-color:#e74c3c;background:#fff5f5}
.field-item.success{border-left-color:#28a745}
.field-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.field-status{font-size:20px;min-width:24px}
.field-position{background:#667eea;color:white;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600}
.field-code{font-family:'Courier New',monospace;font-size:20px;font-weight:600;color:#333;background:white;padding:2px 10px;border-radius:4px;border:1px solid #ddd}
.field-dimension{flex:1;font-size:14px;color:#666;min-width:150px}
.field-meaning{margin-left:34px;font-size:14px;color:#333}
.field-meaning div{margin-bottom:4px}
.warning-section{background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:15px;margin-top:20px}
.warning-section h3{color:#856404;font-size:16px;margin-bottom:10px}
.warning-item{color:#856404;font-size:14px;margin-bottom:5px;padding-left:24px;position:relative}
.warning-item:before{content:"\26a0\fe0f";position:absolute;left:0}
.loading{text-align:center;padding:40px;color:#666}
.loading-spinner{display:inline-block;width:40px;height:40px;border:4px solid #f0f0f0;border-top:4px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.error-message{background:#fee;border:1px solid #e74c3c;border-radius:10px;padding:20px;color:#e74c3c;text-align:center}
.footer{text-align:center;padding:20px;color:#999;font-size:12px;border-top:1px solid #eee}
</style>

function setPN(pn){document.getElementById('pnInput').value=pn;parsePN();}

function identifySeries(pn){
  const pnUpper=pn.toUpperCase().replace(/\s+/g,'');
  const keys=Object.keys(PN_CONFIGS).sort((a,b)=>b.length-a.length);
  for(const seriesName of keys){
    const m1=seriesName.match(/^(.+?)\(/);
    if(m1){const p=m1[1].toUpperCase().replace(/\s+/g,'');if(pnUpper.startsWith(p))return seriesName;}
    const m2=seriesName.match(/（(.+?)）/);
    if(m2){
      let full=m2[1].toUpperCase().replace(/\s+/g,'');
      if(full.includes('（'))full=full.split('（')[0];
      if(pnUpper.startsWith(full))return seriesName;
      const parts=m2[1].split(/[\s\-]+/);
      for(let i=0;i<parts.length;i++){const prefix=parts.slice(0,i+1).join('').toUpperCase().replace(/\s+/g,'');if(prefix.length>=3&&pnUpper.startsWith(prefix))return seriesName;}
    }
    const m3=seriesName.match(/\((.+?)\)/);
    if(m3){
      let full=m3[1].toUpperCase().replace(/\s+/g,'');
      if(pnUpper.startsWith(full))return seriesName;
      const parts=m3[1].split(/[\s\-]+/);
      for(let i=0;i<parts.length;i++){const prefix=parts.slice(0,i+1).join('').toUpperCase().replace(/\s+/g,'');if(prefix.length>=3&&pnUpper.startsWith(prefix))return seriesName;}
    }
    const clean=seriesName.replace(/\s*[\(（].*?[\)）]/g,'').toUpperCase().replace(/\s+/g,'');
    if(pnUpper.startsWith(clean))return seriesName;
    const short=seriesName.replace(/[\(\)（）].*/g,'').toUpperCase().replace(/\s+/g,'');
    if(short.length>=3&&pnUpper.startsWith(short))return seriesName;
  }
  return null;
}

function getSeriesAliases(seriesName){
  const aliases=[];
  const m1=seriesName.match(/^(.+?)\(/);
  if(m1){aliases.push(m1[1].trim().toUpperCase().replace(/\s+/g,''));}
  const m2=seriesName.match(/（(.+?)）/);
  if(m2){
    const raw=m2[1].trim().toUpperCase();
    aliases.push(raw.replace(/\s+/g,''));
    const spaceParts=raw.split(/\s+/);
    for(let i=0;i<spaceParts.length;i++){
      const prefix=spaceParts.slice(0,i+1).join('-');
      if(prefix.length>=2)aliases.push(prefix);
    }
    const p=m2[1].split(/[\s\-]+/);
    for(let i=0;i<p.length;i++){
      const prefix=p.slice(0,i+1).join('').toUpperCase().replace(/\s+/g,'');
      if(prefix.length>=2)aliases.push(prefix);
    }
  }
  const m3=seriesName.match(/\((.+?)\)/);
  if(m3){
    const raw=m3[1].trim().toUpperCase();
    aliases.push(raw.replace(/\s+/g,''));
    const spaceParts=raw.split(/\s+/);
    for(let i=0;i<spaceParts.length;i++){
      const prefix=spaceParts.slice(0,i+1).join('-');
      if(prefix.length>=2)aliases.push(prefix);
    }
    const p=m3[1].split(/[\s\-]+/);
    for(let i=0;i<p.length;i++){
      const prefix=p.slice(0,i+1).join('').toUpperCase().replace(/\s+/g,'');
      if(prefix.length>=2)aliases.push(prefix);
    }
  }
  const clean=seriesName.replace(/\s*[\(（].*?[\)）]/g,'').toUpperCase().replace(/\s+/g,'');
  if(clean)aliases.push(clean);
  const short=seriesName.replace(/[\(\)（）].*/g,'').toUpperCase().replace(/\s+/g,'');
  if(short)aliases.push(short);
  return [...new Set(aliases)].filter(a=>a.length>=2);
}

function splitPN(pn,seriesName){
  const parts=pn.split('-');
  const aliases=getSeriesAliases(seriesName);
  let bestMatchParts=1;
  for(let i=Math.min(parts.length,5);i>=1;i--){
    const candidate=parts.slice(0,i).join('-').toUpperCase().replace(/\s+/g,'');
    for(const alias of aliases){
      if(candidate===alias){bestMatchParts=i;break;}
    }
    if(bestMatchParts>1)break;
  }
  const seriesPart=parts.slice(0,bestMatchParts).join('-');
  const configCode=parts[bestMatchParts]||'';
  const customerCode=parts.slice(bestMatchParts+1).join('-')||'';
  return{seriesPart,configCode,customerCode};
}

function parsePN(){
  const pn=document.getElementById('pnInput').value.trim();
  if(!pn){alert('请输入PN码');return;}
  const btn=document.getElementById('parseBtn');
  const rs=document.getElementById('resultSection');
  btn.disabled=true;btn.textContent='解析中...';
  rs.innerHTML='<div class="loading"><div class="loading-spinner"></div><div>正在解析 PN: '+pn+'...</div></div>';
  rs.classList.add('active');
  
  setTimeout(()=>{
    const series=identifySeries(pn);
    if(!series){
      rs.innerHTML='<div class="error-message"><h3>❌ 解析失败</h3><p>未识别的产品系列</p><p>PN: '+pn+'</p></div>';
      btn.disabled=false;btn.textContent='解析';return;
    }
    const config=PN_CONFIGS[series];
    const dims=config.dimensions;
    const split=splitPN(pn,series);
    const configCode=split.configCode;
    const customerCode=split.customerCode;
    
    const result={success:true,pn:pn,product_series:series,series_part:split.seriesPart,analysis:{config_code:configCode,customer_code:customerCode,fields:[],warnings:[]}};
    
    for(let i=0;i<Math.min(configCode.length,dims.length);i++){
      const char=configCode[i];const dim=dims[i];
      const field={position:i+1,code:char,dimension:dim.name,meaning_cn:'',meaning_en:'',recognized:false};
      if(dim.options[char]){
        field.meaning_cn=dim.options[char].cn||'';
        field.meaning_en=dim.options[char].en||'';
        field.recognized=true;
      }else{
        field.warning='未识别的选项值: '+char;
        result.analysis.warnings.push('维度 "'+dim.name+'" 的选项 "'+char+'" 未识别');
      }
      result.analysis.fields.push(field);
    }
    
    if(configCode.length<dims.length){
      for(let i=configCode.length;i<dims.length;i++){
        result.analysis.fields.push({position:i+1,code:'',dimension:dims[i].name,meaning_cn:'未配置',meaning_en:'Not configured',recognized:false,warning:'配置码长度不足'});
      }
      result.analysis.warnings.push('配置码长度('+configCode.length+')小于维度数('+dims.length+')');
    }
    
    if(customerCode){
      result.analysis.fields.push({position:configCode.length+1,code:customerCode,dimension:'客户代码 Customer code',meaning_cn:'客户定制标识',meaning_en:'Customer specific identifier',recognized:true});
    }
    
    displayResult(result);
    btn.disabled=false;btn.textContent='解析';
  },100);
}

function displayResult(result){
  const rs=document.getElementById('resultSection');
  if(!result.success){
    rs.innerHTML='<div class="error-message"><h3>❌ 解析失败</h3><p>'+(result.error||'未知错误')+'</p></div>';
    return;
  }
  const fields=result.analysis.fields||[];
  const recog=fields.filter(f=>f.recognized!==false&&f.dimension!=='客户代码 Customer code').length;
  const total=fields.filter(f=>f.dimension!=='客户代码 Customer code').length;
  
  let html='<div class="result-header"><h2>📋 '+result.pn+'</h2><div class="result-meta"><span><strong>产品系列:</strong> '+(result.product_series||'未知')+'</span><span><strong>配置码:</strong> '+(result.analysis.config_code||'无')+'</span><span><strong>客户代码:</strong> '+(result.analysis.customer_code||'无')+'</span></div></div>';
  html+='<div class="stats"><div class="stat-item"><div class="stat-value">'+total+'</div><div class="stat-label">总字段数</div></div><div class="stat-item"><div class="stat-value">'+recog+'</div><div class="stat-label">已识别</div></div><div class="stat-item"><div class="stat-value">'+(total-recog)+'</div><div class="stat-label">未识别</div></div></div>';
  html+='<div class="fields-section"><h3>配置字段解析:</h3>';
  
  if(fields.length>0){
    fields.forEach(field=>{
      if(field.dimension==='客户代码 Customer code'){
        html+='<div class="field-item success"><div class="field-header"><span class="field-status">📦</span><span class="field-dimension">'+field.dimension+'</span></div><div class="field-meaning"><div><strong>代码:</strong> '+field.code+'</div><div><strong>含义:</strong> '+(field.meaning_cn||field.meaning_en||'客户定制标识')+'</div></div></div>';
      }else{
        const isErr=field.recognized===false;
        html+='<div class="field-item '+(isErr?'error':'')+'"><div class="field-header"><span class="field-status">'+(isErr?'❌':'✅')+'</span><span class="field-position">第'+field.position+'位</span><span class="field-code">'+(field.code||'?')+'</span><span class="field-dimension">'+field.dimension+'</span></div><div class="field-meaning">'+(field.meaning_cn?'<div><strong>中文:</strong> '+field.meaning_cn+'</div>':'')+(field.meaning_en?'<div><strong>英文:</strong> '+field.meaning_en+'</div>':'')+(isErr?'<div style="color:#e74c3c;"><strong>⚠️ 警告:</strong> '+(field.warning||'未识别的编码')+'</div>':'')+'</div></div>';
      }
    });
  }
  html+='</div>';
  
  if(result.analysis.warnings&&result.analysis.warnings.length>0){
    html+='<div class="warning-section"><h3>⚠️ 警告信息:</h3>'+result.analysis.warnings.map(w=>'<div class="warning-item">'+w+'</div>').join('')+'</div>';
  }
  rs.innerHTML=html;
}

document.getElementById('pnInput').addEventListener('keypress',function(e){if(e.key==='Enter')parsePN();});
window.addEventListener('load',()=>{document.getElementById('pnInput').focus();});
</script>
