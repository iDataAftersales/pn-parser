<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PN解析工具 - iData BOM命名规范</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; padding:20px }
.container { max-width:1000px; margin:0 auto; background:white; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.3); overflow:hidden }
.header { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; padding:30px; text-align:center }
.header h1 { font-size:28px; margin-bottom:10px }
.header p { opacity:0.9; font-size:14px }
.content { padding:40px }
.input-section { margin-bottom:30px }
.input-group { display:flex; gap:10px; margin-bottom:15px }
.input-group input { flex:1; padding:14px 18px; border:2px solid #e0e0e0; border-radius:10px; font-size:18px; font-family:"Courier New",monospace; transition:all 0.3s }
.input-group input:focus { outline:none; border-color:#667eea; box-shadow:0 0 0 4px rgba(102,126,234,0.1) }
.input-group button { padding:14px 36px; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.3s }
.input-group button:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(102,126,234,0.4) }
.examples { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px }
.example-btn { padding:6px 14px; background:#f0f0f0; border:1px solid #ddd; border-radius:6px; font-size:13px; cursor:pointer; transition:all 0.2s; font-family:"Courier New",monospace }
.example-btn:hover { background:#667eea; color:white; border-color:#667eea }
.status-bar { background:#e8f5e9; border:1px solid #4caf50; border-radius:8px; padding:12px 18px; margin-bottom:20px; display:flex; align-items:center; gap:10px; font-size:14px }
.status-bar.loading { background:#fff3cd; border-color:#ffc107 }
.status-bar.error { background:#ffebee; border-color:#f44336 }
.result-section { display:none }
.result-section.active { display:block; animation:slideIn 0.3s ease }
@keyframes slideIn { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }
.result-header { background:#f8f9fa; padding:20px; border-radius:10px; margin-bottom:20px }
.result-header h2 { font-size:22px; color:#333; margin-bottom:10px; font-family:"Courier New",monospace; word-break:break-all }
.result-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; font-size:14px; color:#666 }
.fields-section { margin-top:20px }
.fields-section h3 { font-size:18px; color:#333; margin-bottom:15px; padding-bottom:10px; border-bottom:2px solid #e0e0e0 }
.field-item { background:#f8f9fa; padding:15px; border-radius:10px; margin-bottom:10px; border-left:4px solid #667eea; transition:all 0.2s }
.field-item:hover { background:#f0f0f0 }
.field-item.accessory { border-left-color:#ff9800; background:#fff8e1 }
.field-item.custcode { border-left-color:#4caf50; background:#e8f5e9 }
.field-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap }
.field-status { font-size:20px; min-width:24px }
.field-position { background:#667eea; color:white; padding:2px 10px; border-radius:4px; font-size:12px; font-weight:600 }
.field-code { font-family:"Courier New",monospace; font-size:20px; font-weight:600; color:#333; background:white; padding:2px 10px; border-radius:4px; border:1px solid #ddd }
.field-dimension { flex:1; font-size:14px; color:#666; min-width:150px }
.field-meaning { margin-left:34px; font-size:14px; color:#333 }
.field-desc { margin-left:34px; font-size:13px; color:#888; margin-top:4px; font-style:italic }
.footer { text-align:center; padding:20px; color:#999; font-size:12px; border-top:1px solid #eee }
</style>
</head>

<div class="container">

  <div class="content">

    </div>
    <div id="statusBar" class="status-bar" style="display:none"></div>
    <div id="resultSection" class="result-section">
      <div class="result-header">
        <h2 id="resultPN"></h2>
        <div class="result-meta">

      </div>
      <div class="fields-section">
        <h3>📋 配置代码解析</h3>
        <div id="fieldsContainer"></div>
      </div>
    </div>
  </div>
  <div class="footer">iData PN Parser | 离线版 | 支持189个产品系列</div>
</div>

var COMMON_CHARGING = {"0": "无", "1": "USB数据线", "2": "卡夹", "3": "USB数据线+卡夹", "D": "硬件定制+带数据线", "H": "硬件定制+无数据线"};
var COMMON_ADAPTER = {"0": "无", "1": "电源适配器5V 2A 国标3C", "2": "电源适配器（活动头，含四种插头欧规，美规，英规，澳规 5V 2A）", "3": "电源适配器（澳规，A型母座5V2A）", "4": "电源适配器（欧规，A型母座5V2A）", "5": "单座充-电源适配器（活动头，含四种插头欧规，美规，英规，澳规 12V 2A）（配带电池座充）", "6": "DC充电器", "7": "电源适配器（美规，A型母座5V2A）", "8": "电源适配器（英规，A型母座5V2A）", "9": "DC充电器（四种插脚，5V 1.5A，外贸专用）", "A": "电源适配器20V 2.25A ,美规", "C": "电源适配器5.2V 2.5A  国标3C", "D": "电源适配器5V 2A  印度规", "E": "电源适配器5V 2A ,中性非3C", "J": "电源适配器（巴西规，A型母座5V2A）", "G": "活动头电源适配器（美规），活动头电源适配器本体（ 5V 2A，FJ－SW1260502000UN(126)）+美规插头，增加KC认证标识", "H": "活动头电源适配器（韩规），活动头电源适配器本体（ 5V 2A，FJ－SW1260502000UN(126)）+韩规插头，增加KC认证标识", "U": "电源适配器5V 2A ,韩规", "F": "电源适配器9V 2A ,中性3C", "K": "电源适配器9V 2A ,欧规", "L": "电源适配器9V 2A ,美规", "Y": "电源适配器9V 2A ,英规", "R": "电源适配器9V 2A ,日规", "M": "电源适配器9V 3A ,中性3C"};

// ── 工具函数 ──────────────────────────────────
function setPN(pn) { document.getElementById('pnInput').value = pn; parsePN(); }

function identifySeries(pn) {
  var pnUpper = pn.toUpperCase().replace(/\s+/g, "");
  var keys = Object.keys(PN_CONFIGS).sort(function(a, b) { return b.length - a.length; });
  for (var i = 0; i < keys.length; i++) {
    var seriesName = keys[i];
    var cfg = PN_CONFIGS[seriesName];
    var aliases = cfg.aliases;
    for (var j = 0; j < aliases.length; j++) {
      var alias = aliases[j];
      if (pnUpper.indexOf(alias) === 0) {
        var nextChar = pnUpper.charAt(alias.length);
        if (nextChar === "" || nextChar === "-" || nextChar === "\u2014") {
          return seriesName;
        }
      }
    }
  }
  return null;
}

function splitPN(pn, seriesName) {
  var cfg = PN_CONFIGS[seriesName];
  var aliases = cfg.aliases;
  var parts = pn.split(/[\-]+/g);
  var bestMatchParts = 1;
  for (var i = 0; i < aliases.length; i++) {
    var alias = aliases[i];
    var aliasParts = alias.split(/[\-]+/g);
    if (aliasParts.length >= 1 && aliasParts.length <= parts.length) {
      var candidate = parts.slice(0, aliasParts.length).join("-").toUpperCase();
      if (candidate === alias.toUpperCase()) {
        bestMatchParts = aliasParts.length;
        break;
      }
    }
  }
  var seriesPart = parts.slice(0, bestMatchParts).join("-");
  var configCode = parts[bestMatchParts] || "";
  var suffixParts = parts.slice(bestMatchParts + 1);
  var suffix = suffixParts.join("-");
  return { seriesPart: seriesPart, configCode: configCode, suffix: suffix };
}

function parseAccessory(suffix) {
  if (!suffix || suffix.length < 2) return null;
  var chargingCode = suffix.charAt(0);
  var adapterCode = suffix.charAt(1);
  var custCode = suffix.substring(2);
  return {
    charging: { code: chargingCode, desc: COMMON_CHARGING[chargingCode] || "未知" },
    adapter: { code: adapterCode, desc: COMMON_ADAPTER[adapterCode] || "未知" },
    customerCode: custCode
  };
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function parsePN() {
  var pn = document.getElementById('pnInput').value.trim();
  var statusBar = document.getElementById('statusBar');
  var resultSection = document.getElementById('resultSection');

  if (!pn) {
    statusBar.style.display = 'flex';
    statusBar.className = 'status-bar error';
    statusBar.innerHTML = '❌ 请输入PN码';
    resultSection.className = 'result-section';
    return;
  }

  statusBar.style.display = 'flex';
  statusBar.className = 'status-bar loading';
  statusBar.innerHTML = '⏳ 解析中...';

  setTimeout(function() {
    var seriesName = identifySeries(pn);
    if (!seriesName) {
      statusBar.className = 'status-bar error';
      statusBar.innerHTML = '❌ 无法识别产品系列，请检查PN是否正确';
      resultSection.className = 'result-section';
      return;
    }

    var cfg = PN_CONFIGS[seriesName];
    var split = splitPN(pn, seriesName);
    var configCode = split.configCode;
    var suffix = split.suffix;

    document.getElementById('resultPN').textContent = pn;
    document.getElementById('resultSeries').textContent = seriesName;
    document.getElementById('resultSeriesCode').textContent = split.seriesPart;
    document.getElementById('resultConfigCode').textContent = configCode;
    document.getElementById('resultSuffix').textContent = suffix || '无';

    // 解析配置代码各位
    var fieldsHtml = '';
    var dims = cfg.dims || [];
    var options = cfg.options || {};

    for (var i = 0; i < dims.length; i++) {
      var dimName = dims[i];
      var code = '';
      if (i < configCode.length) {
        code = configCode.charAt(i);
      }
      var optMap = options[dimName] || {};
      var desc = optMap[code] || '';
      var isUnknown = (code === '' || !desc);

      fieldsHtml += '<div class="field-item">';
      fieldsHtml += '<div class="field-header">';
      fieldsHtml += '<span class="field-status">' + (isUnknown ? '⚠️' : '✅') + '</span>';
      fieldsHtml += '<span class="field-position">维度' + (i + 1) + '</span>';
      fieldsHtml += '<span class="field-code">' + (code || '—') + '</span>';
      fieldsHtml += '<span class="field-dimension">' + escapeHtml(dimName) + '</span>';
      fieldsHtml += '</div>';
      if (desc) {
        fieldsHtml += '<div class="field-meaning">' + escapeHtml(desc) + '</div>';
      }
      fieldsHtml += '</div>';
    }

    // 解析配件信息
    if (cfg.hasAccessory && suffix) {
      var acc = parseAccessory(suffix);
      if (acc) {
        fieldsHtml += '<div class="field-item accessory">';
        fieldsHtml += '<div class="field-header">';
        fieldsHtml += '<span class="field-status">🔌</span>';
        fieldsHtml += '<span class="field-position">配件</span>';
        fieldsHtml += '<span class="field-code">' + acc.charging.code + acc.adapter.code + '</span>';
        fieldsHtml += '<span class="field-dimension">充电与通讯方式 + 适配器</span>';
        fieldsHtml += '</div>';
        fieldsHtml += '<div class="field-meaning">充电: ' + escapeHtml(acc.charging.desc) + ' | 适配器: ' + escapeHtml(acc.adapter.desc) + '</div>';
        fieldsHtml += '</div>';

        fieldsHtml += '<div class="field-item custcode">';
        fieldsHtml += '<div class="field-header">';
        fieldsHtml += '<span class="field-status">🏷️</span>';
        fieldsHtml += '<span class="field-position">客户</span>';
        fieldsHtml += '<span class="field-code">' + acc.customerCode + '</span>';
        fieldsHtml += '<span class="field-dimension">客户代码</span>';
        fieldsHtml += '</div>';
        fieldsHtml += '</div>';
      }
    }

    document.getElementById('fieldsContainer').innerHTML = fieldsHtml;
    statusBar.className = 'status-bar';
    statusBar.innerHTML = '✅ 解析完成 - 产品系列: ' + escapeHtml(seriesName);
    resultSection.className = 'result-section active';
  }, 100);
}

document.getElementById('pnInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') parsePN();
});
</script>
