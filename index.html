var ACCESSORY_OPTS = {"charging": {"充电与通讯方式 Charging and communication methods": "", "0": "无", "1": "USB数据线", "2": "卡夹", "3": "USB数据线+卡夹", "D": "硬件定制+带数据线", "H": "硬件定制+无数据线"}, "adapter": {"适配器 Power adapter": "", "0": "无", "1": "电源适配器5V 2A 国标3C", "2": "电源适配器（活动头，含四种插头欧规，美规，英规，澳规 5V 2A）", "3": "电源适配器（澳规，A型母座5V2A）", "4": "电源适配器（欧规，A型母座5V2A）", "5": "单座充-电源适配器（活动头，含四种插头欧规，美规，英规，澳规 12V 2A）（配带电池座充）", "6": "DC充电器", "7": "电源适配器（美规，A型母座5V2A）", "8": "电源适配器（英规，A型母座5V2A）", "9": "DC充电器（四种插脚，5V 1.5A，外贸专用）", "A": "电源适配器20V 2.25A ,美规", "C": "电源适配器5.2V 2.5A  国标3C", "D": "电源适配器5V 2A  印度规", "E": "电源适配器5V 2A ,中性非3C", "J": "电源适配器（巴西规，A型母座5V2A）", "G": "活动头电源适配器（美规），活动头电源适配器本体（ 5V 2A，FJ－SW1260502000UN(126)）+美规插头，增加KC认证标识", "H": "活动头电源适配器（韩规），活动头电源适配器本体（ 5V 2A，FJ－SW1260502000UN(126)）+韩规插头，增加KC认证标识", "U": "电源适配器5V 2A ,韩规", "F": "电源适配器9V 2A ,中性3C", "K": "电源适配器9V 2A ,欧规", "L": "电源适配器9V 2A ,美规"}};

function setPN(pn) {
  document.getElementById("pnInput").value = pn;
  parsePN();
}

function identifySeries(pn) {
  var pnUpper = pn.toUpperCase().replace(/\s+/g, "");
  var keys = Object.keys(PN_CONFIGS).sort(function(a, b) { return b.length - a.length; });
  for (var i = 0; i < keys.length; i++) {
    var seriesName = keys[i];
    var cfg = PN_CONFIGS[seriesName];
    var aliases = cfg.aliases;
    for (var j = 0; j < aliases.length; j++) {
      var alias = aliases[j];
      if (pnUpper.indexOf(alias) === 0) {
        var nextChar = pnUpper.charAt(alias.length);
        if (nextChar === "" || nextChar === "-" || nextChar === "\u2014") {
          return seriesName;
        }
      }
    }
  }
  return null;
}

function splitPN(pn, seriesName) {
  var cfg = PN_CONFIGS[seriesName];
  var aliases = cfg.aliases;
  var parts = pn.split(/[\-]+/g);
  var bestMatchParts = 1;
  for (var i = 0; i < aliases.length; i++) {
    var alias = aliases[i];
    var aliasParts = alias.split(/[\-]+/g);
    if (aliasParts.length >= 1 && aliasParts.length <= parts.length) {
      var candidate = parts.slice(0, aliasParts.length).join("-").toUpperCase();
      if (candidate === alias.toUpperCase()) {
        bestMatchParts = aliasParts.length;
        break;
      }
    }
  }
  var seriesPart = parts.slice(0, bestMatchParts).join("-");
  var configCode = parts[bestMatchParts] || "";
  var suffixParts = parts.slice(bestMatchParts + 1);
  var suffix = suffixParts.join("-");
  return { seriesPart: seriesPart, configCode: configCode, suffix: suffix };
}

function parseAccessory(suffix) {
  if (!suffix || suffix.length < 3) return null;
  return {
    charging: suffix[0],
    adapter: suffix[1],
    custcode: suffix.substring(2)
  };
}

function escapeHtml(text) {
  var div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function parsePN() {
  var pn = document.getElementById("pnInput").value.trim();
  var resultDiv = document.getElementById("resultSection");
  var statusBar = document.getElementById("statusBar");
  if (!pn) { resultDiv.className = "result-section"; return; }
  statusBar.className = "status-bar loading";
  statusBar.innerHTML = "<span>\u23F3</span><span>\u6b63\u5728\u89e3\u6790PN: " + escapeHtml(pn) + " ...</span>";
  setTimeout(function() {
    var seriesName = identifySeries(pn);
    if (!seriesName) {
      statusBar.className = "status-bar error";
      statusBar.innerHTML = "<span>\u274C</span><span>\u65e0\u6cd5\u8bc6\u522b\u4ea7\u54c1\u7cfb\u5217\uff0c\u8bf7\u68c0\u67e5PN\u662f\u5426\u6b63\u786e</span>";
      resultDiv.className = "result-section";
      return;
    }
    var cfg = PN_CONFIGS[seriesName];
    var parts = splitPN(pn, seriesName);
    var hasAcc = cfg.hasAccessory;
    var accInfo = (hasAcc && parts.suffix) ? parseAccessory(parts.suffix) : null;
    var html = "<div class=\"result-header\"><h2>" + escapeHtml(pn) + "</h2>";
    html += "<div class=\"result-meta\">";
    html += "<div><strong>\u4ea7\u54c1\u7cfb\u5217:</strong> " + escapeHtml(seriesName) + "</div>";
    html += "<div><strong>\u7cfb\u5217\u4ee3\u7801:</strong> " + escapeHtml(parts.seriesPart) + "</div>";
    html += "<div><strong>\u914d\u7f6e\u4ee3\u7801:</strong> " + escapeHtml(parts.configCode || "(\u7a7a)") + "</div>";
    if (parts.suffix) { html += "<div><strong>\u540e\u7f00:</strong> " + escapeHtml(parts.suffix) + "</div>"; }
    html += "</div></div>";
    if (parts.configCode && cfg.dims && cfg.dims.length > 0) {
      html += "<div class=\"fields-section\"><h3>\uD83D\uDCCB \u914d\u7f6e\u4ee3\u7801\u89e3\u6790</h3>";
      var dims = cfg.dims;
      for (var i = 0; i < dims.length; i++) {
        var codeChar = i < parts.configCode.length ? parts.configCode[i].toUpperCase() : "";
        var status = codeChar ? "\u2705" : "\u26A0\uFE0F";
        var cls = codeChar ? "" : " warning";
        html += "<div class=\"field-item" + cls + "\">";
        html += "<div class=\"field-header\">";
        html += "<span class=\"field-status\">" + status + "</span>";
        html += "<span class=\"field-position\">\u7ef4\u5ea6" + (i+1) + "</span>";
        if (codeChar) { html += "<span class=\"field-code\">" + escapeHtml(codeChar) + "</span>"; }
        html += "<span class=\"field-dimension\">" + escapeHtml(dims[i]) + "</span>";
        html += "</div>";
        if (codeChar) {
          html += "<div class=\"field-meaning\"><div>\u4ee3\u7801: <strong>" + escapeHtml(codeChar) + "</strong></div></div>";
        } else {
          html += "<div class=\"field-meaning\" style=\"color:#e74c3c;\">\u914d\u7f6e\u4ee3\u7801\u957f\u5ea6\u4e0d\u8db3\uff0c\u8be5\u7ef4\u5ea6\u65e0\u5bf9\u5e94\u4ee3\u7801</div>";
        }
        html += "</div>";
      }
      html += "</div>";
    }
    if (hasAcc && accInfo) {
      html += "<div class=\"fields-section\"><h3>\uD83D\uDD0C \u914d\u4ef6\u4fe1\u606f\u89e3\u6790</h3>";
      var chg = accInfo.charging;
      var chgDesc = (ACCESSORY_OPTS.charging && ACCESSORY_OPTS.charging[chg]) || "(\u672a\u77e5\u4ee3\u7801: " + chg + ")";
      html += "<div class=\"field-item accessory\">";
      html += "<div class=\"field-header\">";
      html += "<span class=\"field-status\">\uD83D\uDD0C</span>";
      html += "<span class=\"field-position\">M</span>";
      html += "<span class=\"field-code\">" + escapeHtml(chg) + "</span>";
      html += "<span class=\"field-dimension\">\u5145\u7535\u4e0e\u901a\u8baf\u65b9\u5f0f</span>";
      html += "</div>";
      html += "<div class=\"field-meaning\"><div>" + escapeHtml(chgDesc) + "</div></div>";
      html += "</div>";
      var adp = accInfo.adapter;
      var adpDesc = (ACCESSORY_OPTS.adapter && ACCESSORY_OPTS.adapter[adp]) || "(\u672a\u77e5\u4ee3\u7801: " + adp + ")";
      html += "<div class=\"field-item accessory\">";
      html += "<div class=\"field-header\">";
      html += "<span class=\"field-status\">\uD83D\uDD0B</span>";
      html += "<span class=\"field-position\">N</span>";
      html += "<span class=\"field-code\">" + escapeHtml(adp) + "</span>";
      html += "<span class=\"field-dimension\">\u9002\u914d\u5668</span>";
      html += "</div>";
      html += "<div class=\"field-meaning\"><div>" + escapeHtml(adpDesc) + "</div></div>";
      html += "</div>";
      var cc = accInfo.custcode;
      html += "<div class=\"field-item custcode\">";
      html += "<div class=\"field-header\">";
      html += "<span class=\"field-status\">\uD83D\uDC64</span>";
      html += "<span class=\"field-position\">O</span>";
      html += "<span class=\"field-code\">" + escapeHtml(cc) + "</span>";
      html += "<span class=\"field-dimension\">\u5ba2\u6237\u4ee3\u7801</span>";
      html += "</div>";
      html += "<div class=\"field-meaning\"><div>\u5ba2\u6237\u4ee3\u7801: <strong>" + escapeHtml(cc) + "</strong></div></div>";
      html += "</div>";
      html += "</div>";
    } else if (parts.suffix) {
      html += "<div class=\"fields-section\"><h3>\uD83D\uDC64 \u5ba2\u6237\u4ee3\u7801</h3>";
      html += "<div class=\"field-item custcode\">";
      html += "<div class=\"field-header\">";
      html += "<span class=\"field-status\">\uD83D\uDC64</span>";
      html += "<span class=\"field-code\">" + escapeHtml(parts.suffix) + "</span>";
      html += "<span class=\"field-dimension\">\u5ba2\u6237\u4ee3\u7801</span>";
      html += "</div></div></div>";
    }
    resultDiv.innerHTML = html;
    resultDiv.className = "result-section active";
    statusBar.className = "status-bar";
    statusBar.innerHTML = "<span>\u2705</span><span><strong>\u89e3\u6790\u5b8c\u6210</strong> - \u4ea7\u54c1\u7cfb\u5217: " + escapeHtml(seriesName) + "</span>";
  }, 100);
}

document.getElementById("pnInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") { parsePN(); }
});
</script>
