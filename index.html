<style>
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; color: #1a1a2e; margin-bottom: 8px; font-size: 26px; }

input[type=text] { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: border-color .2s; }
input[type=text]:focus { outline: none; border-color: #4361ee; }
button { background: linear-gradient(135deg, #4361ee, #3a0ca3); color: #fff; border: none; padding: 12px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 14px; transition: opacity .2s; }
button:hover { opacity: .88; }
.result { margin-top: 20px; }
.result-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.result-table th { background: #4361ee; color: #fff; padding: 10px 14px; text-align: left; font-size: 14px; }
.result-table td { padding: 9px 14px; border-bottom: 1px solid #eee; font-size: 14px; }
.result-table tr:nth-child(even) td { background: #f8f9ff; }
.dim-name { color: #4361ee; font-weight: 600; }
.code { display: inline-block; background: #e8edff; color: #3a0ca3; padding: 2px 8px; border-radius: 4px; font-family: Consolas, monospace; font-size: 13px; margin-right: 6px; }
.desc { color: #444; }
.accessory-note { background: #fff8e1; border-left: 4px solid #ffc107; padding: 10px 14px; border-radius: 0 8px 8px 0; margin-top: 14px; font-size: 13px; color: #856404; }
.error { color: #d32f2f; background: #ffeaea; padding: 12px 16px; border-radius: 8px; margin-top: 14px; }
.series-badge { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
.footer { text-align: center; color: #aaa; font-size: 12px; margin-top: 30px; }
</style>
</head>

function getSeriesAliases(seriesName) {
    var cfg = SERIES_CONFIG[seriesName];
    if (cfg && cfg.aliases) return cfg.aliases;
    var n = seriesName.toUpperCase();
    var aliases = [];
    var m1 = n.match(/^(.+?)\(/);
    if (m1) aliases.push(m1[1].replace(/\s+/g, ''));
    var m2 = n.match(/[\(（](.+?)[\)）]/);
    if (m2) {
        aliases.push(m2[1].replace(/\s+/g, ''));
        var parts = m2[1].split(/\s+/);
        for (var i = 1; i <= parts.length; i++) {
            var prefix = parts.slice(0, i).join('').toUpperCase().replace(/\s+/g, '');
            if (prefix.length >= 2) aliases.push(prefix);
        }
    }
    var clean = n.replace(/[\(（].*/, '').replace(/\s+/g, '');
    if (clean) aliases.push(clean);
    var noCn = clean.replace(/[\u4e00-\u9fff]+/g, '');
    if (noCn && noCn.length >= 2) aliases.push(noCn);
    return aliases.filter(function(a, i) { return aliases.indexOf(a) === i; });
}

function identifySeries(pn) {
    var parts = pn.split('-').map(function(p) { return p.toUpperCase().replace(/\s+/g, ''); });
    var bestKey = null;
    var bestLen = 0;
    for (var key in SERIES_CONFIG) {
        var aliases = getSeriesAliases(key);
        for (var a = 0; a < aliases.length; a++) {
            var alias = aliases[a];
            for (var i = 1; i <= Math.min(parts.length, 4); i++) {
                var candidate = parts.slice(0, i).join('-');
                if (candidate === alias && alias.length > bestLen) {
                    bestLen = alias.length;
                    bestKey = key;
                }
            }
        }
    }
    if (!bestKey) return null;
    var cfg = SERIES_CONFIG[bestKey];
    var aliases2 = getSeriesAliases(bestKey);
    var splitAt = 1;
    for (var i = Math.min(parts.length, 4); i >= 1; i--) {
        var cand = parts.slice(0, i).join('-');
        for (var a2 = 0; a2 < aliases2.length; a2++) {
            if (aliases2[a2] === cand) { splitAt = i; break; }
        }
        if (splitAt === i) break;
    }
    return { key: bestKey, splitAt: splitAt, config: cfg };
}

function parsePN() {
    var pn = document.getElementById('pnInput').value.trim();
    var rc = document.getElementById('resultContent');
    if (!pn) { rc.innerHTML = '<div class="error">⚠️ 请输入 PN</div>'; document.getElementById('resultCard').style.display = 'block'; return; }

    var info = identifySeries(pn);
    if (!info) {
        rc.innerHTML = '<div class="error">❌ 未找到匹配的型号，请检查 PN 是否正确。<br>当前 PN：<code>' + pn + '</code></div>';
        document.getElementById('resultCard').style.display = 'block';
        return;
    }

    var parts = pn.split('-');
    var seriesPart = parts.slice(0, info.splitAt).join('-');
    var configCode = parts[info.splitAt] || '';
    var customerCode = parts.slice(info.splitAt + 1).join('-') || '';

    var cfg = info.config;
    var dims = cfg.dims || [];
    var options = cfg.options || {};

    var html = '<div class="series-badge">📦 型号：' + info.key + '</div>';
    html += '<p style="margin:8px 0 14px 0;color:#666">PN：<code style="background:#f0f0f0;padding:2px 8px;border-radius:4px">' + pn + '</code></p>';
    html += '<table class="result-table"><thead><tr><th>维度</th><th>代码</th><th>含义</th></tr></thead><tbody>';

    // 分离"产品维度"和"配件维度"
    var productDims = [];
    var accessoryDims = [];
    for (var d = 0; d < dims.length; d++) {
        var dn = dims[d];
        if (dn.indexOf('充电') >= 0 || dn.indexOf('适配器') >= 0 || dn.indexOf('客户代码') >= 0 ||
            dn.indexOf('Charging') >= 0 || dn.indexOf('Power adapter') >= 0 || dn.indexOf('Customer') >= 0) {
            accessoryDims.push(dn);
        } else {
            productDims.push(dn);
        }
    }

    // 解析配置码（产品维度部分）
    var cc = configCode;
    for (var i = 0; i < productDims.length && i < cc.length; i++) {
        var dn = productDims[i];
        var code = cc.charAt(i);
        var opt = options[dn] || {};
        var desc = opt[code] || '<span style="color:#999">（未知代码 ' + code + '）</span>';
        html += '<tr><td class="dim-name">' + dn + '</td><td><span class="code">' + code + '</span></td><td class="desc">' + desc + '</td></tr>';
    }

    // 解析配件信息（从客户代码前几位）
    if (cfg.has_accessory && customerCode.length >= 2) {
        html += '<tr><td colspan="3" style="background:#f8f9ff;font-weight:600;color:#4361ee;padding:10px 14px">🔌 配件信息</td></tr>';
        var chargingCode = customerCode.charAt(0);
        var adapterCode = customerCode.charAt(1);
        var custCode = customerCode.slice(2);

        var commonCharging = (cfg.common_charging || {});
        var chargingDesc = (options['充电与通讯方式 Charging and communication methods'] || {})[chargingCode] ||
                         (options['充电与通讯方式'] || {})[chargingCode] ||
                         commonCharging[chargingCode] || '';
        html += '<tr><td class="dim-name">充电与通讯方式</td><td><span class="code">' + chargingCode + '</span></td><td class="desc">' + (chargingDesc || '（未知）') + '</td></tr>';

        var commonAdapter = (cfg.common_adapter || {});
        var adapterDesc = (options['适配器 Power adapter'] || {})[adapterCode] ||
                         (options['适配器'] || {})[adapterCode] ||
                         commonAdapter[adapterCode] || '';
        html += '<tr><td class="dim-name">适配器</td><td><span class="code">' + adapterCode + '</span></td><td class="desc">' + (adapterDesc || '（未知）') + '</td></tr>';

        if (custCode) {
            var custOpt = (options['客户代码 Customer Code'] || {})[custCode] ||
                         (options['客户代码'] || {})[custCode] || '';
            html += '<tr><td class="dim-name">客户代码</td><td><span class="code">' + custCode + '</span></td><td class="desc">' + (custOpt || custCode) + '</td></tr>';
        }
    } else if (!cfg.has_accessory && cc.length > productDims.length) {
        html += '<tr><td colspan="3" style="background:#fff8e1;color:#856404;padding:8px 14px;font-size:13px">⚠️ 配置码长度(' + cc.length + ')超过维度数量(' + productDims.length + ')，部分代码未解析</td></tr>';
    }

    html += '</tbody></table>';
    
    if (cfg.has_accessory) {
        html += '<div class="accessory-note">💡 配件信息（充电方式/适配器）编码在客户代码的前两位，格式：充电方式+适配器+客户代码</div>';
    }

    rc.innerHTML = html;
    document.getElementById('resultCard').style.display = 'block';
}

    document.getElementById('pnInput').focus();
});
