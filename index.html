* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { color: white; text-align: center; margin-bottom: 30px; font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
.card { background: white; border-radius: 15px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.input-group { display: flex; gap: 10px; margin-bottom: 20px; }
input[type="text"] { flex: 1; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: border-color 0.3s; }
input[type="text"]:focus { outline: none; border-color: #667eea; }
button { padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: transform 0.2s; }
button:hover { transform: translateY(-2px); }
.result { margin-top: 20px; }
.result-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
.result-table th, .result-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
.result-table th { background: #f5f5f5; font-weight: 600; color: #333; }
.result-table tr:hover { background: #f9f9f9; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.badge-dimension { background: #e3f2fd; color: #1976d2; }
.badge-code { background: #fff3e0; color: #f57c00; }
.badge-desc { background: #e8f5e9; color: #388e3c; }
.error { background: #ffebee; color: #c62828; padding: 15px; border-radius: 8px; margin-top: 15px; }
.success { background: #e8f5e9; color: #2e7d32; padding: 15px; border-radius: 8px; margin-top: 15px; }
</style>
</head>

function getAliases(n) {
    let aliases = new Set();
    let m1 = n.match(/^(.+?)\(/);
    if (m1) aliases.add(m1[1].trim().toUpperCase().replace(/\s+/g, ''));
    let m2 = n.match(/[\(（](.+?)[\)）]/);
    if (m2) {
        aliases.add(m2[1].trim().toUpperCase().replace(/\s+/g, ''));
        let parts = m2[1].split(/[\s\-]+/);
        for (let i = 0; i < parts.length; i++) {
            let prefix = parts.slice(0, i+1).join('').toUpperCase().replace(/\s+/g, '');
            if (prefix.length >= 2) aliases.add(prefix);
        }
    }
    let clean = n.replace(/[\(（].*/, '').toUpperCase().replace(/\s+/g, '');
    if (clean) {
        aliases.add(clean);
        let noCn = clean.replace(/[\u4e00-\u9fff]+/g, '');
        if (noCn && noCn.length >= 2) aliases.add(noCn);
    }
    let short = n.replace(/[\(（].*/, '').toUpperCase().replace(/\s+/g, '');
    if (short) {
        aliases.add(short);
        let noCn2 = short.replace(/[\u4e00-\u9fff]+/g, '');
        if (noCn2 && noCn2.length >= 2 && !aliases.has(noCn2)) aliases.add(noCn2);
    }
    if (n.toUpperCase().includes('A50P')) aliases.add('50P');
    return Array.from(aliases).sort((a, b) => b.length - a.length);
}

function identifySeries(pn) {
    let parts = pn.split('-');
    let bestKey = null;
    let bestLen = 0;
    for (let [seriesKey, cfg] of Object.entries(PN_CONFIGS)) {
        let aliases = getAliases(seriesKey);
        for (let alias of aliases) {
            for (let i = 1; i <= Math.min(parts.length, 4); i++) {
                let candidate = parts.slice(0, i).join('-').toUpperCase().replace(/\s+/g, '');
                if (candidate === alias && alias.length > bestLen) {
                    bestLen = alias.length;
                    bestKey = seriesKey;
                }
            }
        }
    }
    if (!bestKey) return null;
    let cfg = PN_CONFIGS[bestKey];
    let aliases2 = getAliases(bestKey);
    let splitAt = 1;
    for (let i = Math.min(parts.length, 4); i >= 1; i--) {
        let cand = parts.slice(0, i).join('-').toUpperCase().replace(/\s+/g, '');
        for (let a of aliases2) {
            if (a === cand) { splitAt = i; break; }
        }
        if (splitAt === i) break;
    }
    return { key: bestKey, splitAt: splitAt, config: cfg };
}

    let seriesPart = parts.slice(0, splitAt).join('-');
    let configCode = splitAt < parts.length ? parts[splitAt] : '';
    let customerCode = splitAt + 1 < parts.length ? parts.slice(splitAt + 1).join('-') : '';

    let dims = config.dims || [];
    let options = config.options || {};
    let hasAccessory = config.has_accessory || false;

    let nonAccDims = dims.filter(d => !d.includes('充电') && !d.includes('适配器') && !d.includes('客户代码'));

    let html = '<div class="success">';
    html += '<h3>✅ ' + key + '</h3>';
    html += '<p><strong>系列:</strong> ' + seriesPart + ' | <strong>配置码:</strong> ' + configCode + ' | <strong>客户代码:</strong> ' + customerCode + '</p>';
    html += '</div>';

    html += '<table class="result-table">';
    html += '<thead><tr><th>#</th><th>维度</th><th>代码</th><th>含义</th></tr></thead>';
    html += '<tbody>';

    for (let i = 0; i < nonAccDims.length && i < configCode.length; i++) {
        let dim = nonAccDims[i];
        let code = configCode[i];
        let opts = options[dim] || {};
        let desc = opts[code] || '(未知代码)';
        html += '<tr>';
        html += '<td>' + (i+1) + '</td>';
        html += '<td><span class="badge badge-dimension">' + dim + '</span></td>';
        html += '<td><span class="badge badge-code">' + code + '</span></td>';
        html += '<td><span class="badge badge-desc">' + desc + '</span></td>';
        html += '</tr>';
    }

    if (hasAccessory && customerCode.length >= 2) {
        let chargeCode = customerCode[0];
        let adapterCode = customerCode[1];
        let cc = customerCode.substring(2);

        html += '<tr><td colspan="4" style="background:#f5f5f5;font-weight:bold;">🔧 配件信息</td></tr>';

        let chargeDesc = COMMON_CHARGING[chargeCode] || options['充电与通讯方式']?.[chargeCode] || '(未知)';
        html += '<tr><td>' + (nonAccDims.length+1) + '</td><td>充电与通讯方式</td><td>' + chargeCode + '</td><td>' + chargeDesc + '</td></tr>';

        let adapterDesc = COMMON_ADAPTER[adapterCode] || options['适配器']?.[adapterCode] || '(未知)';
        html += '<tr><td>' + (nonAccDims.length+2) + '</td><td>适配器</td><td>' + adapterCode + '</td><td>' + adapterDesc + '</td></tr>';

        if (cc) {
            html += '<tr><td>' + (nonAccDims.length+3) + '</td><td>客户代码</td><td colspan="2">' + cc + '</td></tr>';
        }
    }

    html += '</tbody></table>';

    document.getElementById('result').innerHTML = html;
}
</script>
</body>
</html>
